spring:
  datasource:
    url: jdbc:postgresql://postgresql:5432/emify
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    url: jdbc:postgresql://postgresql:5432/emify
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 3000          # ← timeout de 3 segundos
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      group-id: emify-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8080

emify:
  kafka:
    enabled: true
  session:
    # __Host- obliga al navegador a exigir Secure, Path=/ y sin Domain (no se puede compartir con subdominios)
    cookie-name: __Host-emify_session
    cookie-secure: true
    single-session: ${EMIFY_SINGLE_SESSION:false}
  uploads:
    # El contenedor no guarda archivos entre reinicios; las imágenes se ignoran hasta tener S3
    enabled: false

logging:
  level:
    org.springframework.security: WARN
    com.emify: INFO
