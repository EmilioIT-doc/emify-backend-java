# =============================================================
# Configuración común a todos los perfiles.
#
# Perfiles de base de datos:
#   - sqlite   (DEFAULT, sin instalar nada) → archivo ./emify-local.db
#   - postgres (PostgreSQL local en localhost:5432)
#   - prod     (OpenShift / servidor; lo activa el Dockerfile)
#
# Para cambiar de perfil:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# =============================================================
spring:
  profiles:
    # Solo aplica cuando no hay ningún perfil activo (en el servidor SPRING_PROFILES_ACTIVE=prod)
    default: sqlite

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      # Fotos de referencia (citas) e imágenes de productos. El default de Spring es 1MB,
      # con eso una foto normal de celular hacía fallar la reserva completa.
      max-file-size: 10MB
      max-request-size: 12MB

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: emify-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8080

emify:
  # Zona horaria de los negocios. Los horarios (slots) y las citas se guardan en hora local
  # del negocio; si llega una fecha con "Z"/offset se convierte a esta zona.
  timezone: America/Mexico_City
  kafka:
    # Sin broker de Kafka cada cita se tardaba ~3s esperando la conexión. Solo prod lo prende.
    enabled: false
  dev:
    # Mientras no haya SMTP, regresa el código de verificación en la respuesta (solo local).
    expose-verification-code: false
  uploads:
    # Guarda imágenes (referencia de citas, productos) en disco y las sirve en /uploads/**.
    # Es para pruebas locales; en el servidor debería ir a S3 o similar.
    enabled: false
    dir: ./uploads
  # Sesiones (cookie HttpOnly + tabla user_sessions). Ver security/session/SessionProperties.
  session:
    cookie-name: emify_session
    cookie-secure: true          # en local (http) lo apagan los perfiles sqlite/postgres
    same-site: Lax
    idle-timeout: 7d             # sin usar la app 7 días → se cierra
    absolute-timeout: 30d        # a los 30 días siempre vuelve a pedir contraseña
    rotation-interval: 24h       # el token de la cookie se renueva cada día
    rotation-grace: 2m
    touch-interval: 5m
    single-session: false        # true = una sola sesión activa por cuenta
    max-active: 10

logging:
  level:
    org.springframework.security: INFO
    com.emify: DEBUG
